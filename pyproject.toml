[project]
name = "flyin-hon"
version = "0.1.0"
description = "Fly-In drone simulation challenge"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.mypy]
python_version = "3.10"
exclude = ["^\\.venv/"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
